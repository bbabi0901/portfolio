name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_NOTION_SYNC: "1"
      MOCK_LLM: "1"
      MOCK_NOTION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate spec.json
        run: npm run check:spec

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # route.ts 등이 data/portfolio.server.json 을 정적 import 한다.
      # ADR-030 이후 이 파일은 커밋되므로 평소엔 존재하지만, 없을 때만 sample 로 폴백
      # (커밋된 실데이터를 덮어쓰지 않도록 조건부 복사).
      - name: Provide portfolio data (sample fallback)
        run: "[ -f data/portfolio.server.json ] || cp data/portfolio.sample.json data/portfolio.server.json"

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit + component tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    if: false # TODO(post-mvp): enable when content pipeline is in place
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_NOTION_SYNC: "1"
      MOCK_LLM: "1"
      MOCK_NOTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
