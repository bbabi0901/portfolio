name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_NOTION_SYNC: "1"
      MOCK_LLM: "1"
      MOCK_NOTION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate spec.json
        run: npm run check:spec

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # CI 테스트는 커밋된 실데이터가 아닌 sample 기준으로 돌아야 결정적이다
      # (retrieval NO_RECORD 테스트 등이 실제 콘텐츠에 좌우되지 않도록 무조건 교체).
      # Vercel 빌드는 이 워크플로와 무관하게 커밋된 실데이터를 사용한다 (ADR-030).
      - name: Provide portfolio data (sample for deterministic tests)
        run: cp data/portfolio.sample.json data/portfolio.server.json

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit + component tests
        run: npm run test

      - name: Build
        run: npm run build

  # 접근성 전용 경량 e2e — axe WCAG 스캔 + 스킵 링크 (FEAT-013). 전체 e2e 활성화와 별개.
  a11y:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_NOTION_SYNC: "1"
      MOCK_LLM: "1"
      MOCK_NOTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/a11y.e2e.ts --project="MacBook 13"

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    if: false # TODO(post-mvp): enable when content pipeline is in place
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_NOTION_SYNC: "1"
      MOCK_LLM: "1"
      MOCK_NOTION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
